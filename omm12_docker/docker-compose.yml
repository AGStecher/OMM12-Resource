
# Same structure as daisybio/namco's docker-compose.yml (app + shinyproxy + nginx).
# Run from inside omm12_docker/:  docker compose build && docker compose up -d

services:
  omm12:
    build:
      context: ..                          # the OMM12_website folder (app.R, data/, www/)
      dockerfile: omm12_docker/app/Dockerfile
    image: omm12:latest
    expose:
      - 3838
    networks:
      - sp-net

  shinyproxy:
    build: ./shinyproxy
    depends_on:
      - omm12
    expose:
      - 8080
    networks:
      - sp-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs/:/opt/shinyproxy/container-logs/

  nginx:
    image: nginx:1.25
    restart: unless-stopped
    ports:
      - 3849:80   # host port -- namco uses 3848 on the same server
    networks:
      - sp-net
    depends_on:
      - shinyproxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

networks:
  sp-net:
    # Fixed name so it always matches container-network in shinyproxy/application.yml,
    # no matter what folder this is deployed from.
    name: omm12_sp-net
