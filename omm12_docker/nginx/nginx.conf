events {}
http {

    client_max_body_size 100M;

    upstream omm12 {
        server shinyproxy:8080;
    }

    server {

        listen 80;
        server_name localhost;

        underscores_in_headers on;

        # NOTE: this local nginx is the same pattern as namco's -- it's what
        # docker-compose exposes on a host port (see docker-compose.yml).
        # Whether you need a "/omm12" location block here, or whether the
        # daisybio server's own top-level nginx/reverse proxy already strips
        # the "/omm12" prefix before forwarding to this container's port,
        # depends on how Markus's team routes daisybio.ls.tum.de/omm12 to
        # this stack -- confirm with them and adjust the location path below
        # if requests need to arrive here already stripped of "/omm12".
        location / {
            proxy_pass          http://omm12;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 600s;

            proxy_redirect    off;
            proxy_set_header  Host             $http_host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Protocol $scheme;
        }
    }
}
